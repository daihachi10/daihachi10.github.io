<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>元素1-36 確認クイズ</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --main: #2563eb;
      --main-dark: #1d4ed8;
      --ok: #16a34a;
      --ng: #dc2626;
      --border: #d1d5db;
      --soft: #eff6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #e0ecff, #f8fafc);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: min(780px, 100%);
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(30, 64, 175, 0.15);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 5vw, 40px);
      letter-spacing: 0.03em;
    }

    .lead {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.7;
    }

    .mode-area {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-btn {
      border: 2px solid var(--border);
      background: #fff;
      border-radius: 14px;
      padding: 12px 10px;
      cursor: pointer;
      font-weight: 700;
      color: var(--text);
      transition: 0.15s;
    }

    .mode-btn.active {
      border-color: var(--main);
      background: var(--soft);
      color: var(--main-dark);
    }

    .quiz-card {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 24px;
      margin-top: 12px;
    }

    .status {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 18px;
    }

    .question-type {
      display: inline-block;
      color: var(--main);
      background: var(--soft);
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .question {
      font-size: clamp(34px, 8vw, 70px);
      font-weight: 900;
      text-align: center;
      margin: 10px 0 24px;
      letter-spacing: 0.05em;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      width: 100%;
      font-size: 22px;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      outline: none;
      transition: 0.15s;
      background: #fff;
    }

    input:focus {
      border-color: var(--main);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    button {
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
    }

    .check-btn {
      background: var(--main);
      color: white;
    }

    .check-btn:hover {
      background: var(--main-dark);
    }

    .sub-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .light-btn {
      background: #e5e7eb;
      color: #374151;
    }

    .light-btn:hover {
      background: #d1d5db;
    }

    .result {
      min-height: 38px;
      margin-top: 18px;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.6;
    }

    .correct {
      color: var(--ok);
    }

    .wrong {
      color: var(--ng);
    }

    .progress-wrap {
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 18px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--main);
      transition: width 0.25s;
    }

    .list {
      margin-top: 18px;
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }

    .list.show {
      display: grid;
    }

    .element-item {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 14px;
    }

    .symbol {
      font-weight: 900;
      color: var(--main-dark);
      margin-right: 6px;
    }

    @media (max-width: 620px) {
      .app {
        padding: 20px;
      }

      .mode-area {
        grid-template-columns: 1fr;
      }

      .input-row {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>元素1〜36 確認クイズ</h1>
    <p class="lead">
      元素名→元素記号、元素記号→元素名、両方ミックスで練習できます。
      入力したらEnterキーでも採点できます。
    </p>

    <section class="mode-area">
      <button class="mode-btn active" data-mode="nameToSymbol">元素名 → 元素記号</button>
      <button class="mode-btn" data-mode="symbolToName">元素記号 → 元素名</button>
      <button class="mode-btn" data-mode="mixed">両方ランダム</button>
    </section>

    <section class="quiz-card">
      <div class="status">
        <span id="progressText">1 / 36</span>
        <span id="scoreText">正解: 0　不正解: 0</span>
      </div>

      <div id="questionType" class="question-type">元素名 → 元素記号</div>
      <div id="question" class="question">水素</div>

      <div class="input-row">
        <input id="answerInput" type="text" autocomplete="off" placeholder="答えを入力" />
        <button id="checkBtn" class="check-btn">採点</button>
      </div>

      <div class="sub-actions">
        <button id="skipBtn" class="light-btn">スキップ</button>
        <button id="restartBtn" class="light-btn">最初から</button>
        <button id="toggleListBtn" class="light-btn">元素一覧を表示</button>
      </div>

      <div id="result" class="result"></div>

      <div class="progress-wrap">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="elementList" class="list"></div>
    </section>
  </main>

  <script>
    const elements = [
      { no: 1, name: "水素", symbol: "H" },
      { no: 2, name: "ヘリウム", symbol: "He" },
      { no: 3, name: "リチウム", symbol: "Li" },
      { no: 4, name: "ベリリウム", symbol: "Be" },
      { no: 5, name: "ホウ素", symbol: "B" },
      { no: 6, name: "炭素", symbol: "C" },
      { no: 7, name: "窒素", symbol: "N" },
      { no: 8, name: "酸素", symbol: "O" },
      { no: 9, name: "フッ素", symbol: "F" },
      { no: 10, name: "ネオン", symbol: "Ne" },
      { no: 11, name: "ナトリウム", symbol: "Na" },
      { no: 12, name: "マグネシウム", symbol: "Mg" },
      { no: 13, name: "アルミニウム", symbol: "Al" },
      { no: 14, name: "ケイ素", symbol: "Si" },
      { no: 15, name: "リン", symbol: "P" },
      { no: 16, name: "硫黄", symbol: "S" },
      { no: 17, name: "塩素", symbol: "Cl" },
      { no: 18, name: "アルゴン", symbol: "Ar" },
      { no: 19, name: "カリウム", symbol: "K" },
      { no: 20, name: "カルシウム", symbol: "Ca" },
      { no: 21, name: "スカンジウム", symbol: "Sc" },
      { no: 22, name: "チタン", symbol: "Ti" },
      { no: 23, name: "バナジウム", symbol: "V" },
      { no: 24, name: "クロム", symbol: "Cr" },
      { no: 25, name: "マンガン", symbol: "Mn" },
      { no: 26, name: "鉄", symbol: "Fe" },
      { no: 27, name: "コバルト", symbol: "Co" },
      { no: 28, name: "ニッケル", symbol: "Ni" },
      { no: 29, name: "銅", symbol: "Cu" },
      { no: 30, name: "亜鉛", symbol: "Zn" },
      { no: 31, name: "ガリウム", symbol: "Ga" },
      { no: 32, name: "ゲルマニウム", symbol: "Ge" },
      { no: 33, name: "ヒ素", symbol: "As" },
      { no: 34, name: "セレン", symbol: "Se" },
      { no: 35, name: "臭素", symbol: "Br" },
      { no: 36, name: "クリプトン", symbol: "Kr" }
    ];

    const aliases = {
      "硼素": "ホウ素",
      "珪素": "ケイ素",
      "燐": "リン",
      "いおう": "硫黄",
      "イオウ": "硫黄",
      "砒素": "ヒ素",
      "ヒソ": "ヒ素"
    };

    let mode = "nameToSymbol";
    let questions = [];
    let currentIndex = 0;
    let correct = 0;
    let wrong = 0;
    let answered = false;

    const questionEl = document.getElementById("question");
    const questionTypeEl = document.getElementById("questionType");
    const inputEl = document.getElementById("answerInput");
    const resultEl = document.getElementById("result");
    const progressTextEl = document.getElementById("progressText");
    const scoreTextEl = document.getElementById("scoreText");
    const progressBarEl = document.getElementById("progressBar");
    const checkBtn = document.getElementById("checkBtn");
    const skipBtn = document.getElementById("skipBtn");
    const restartBtn = document.getElementById("restartBtn");
    const toggleListBtn = document.getElementById("toggleListBtn");
    const elementListEl = document.getElementById("elementList");

    function shuffle(array) {
      const copied = [...array];
      for (let i = copied.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }
      return copied;
    }

    function normalizeSymbol(value) {
      const trimmed = value.trim();
      if (!trimmed) return "";
      return trimmed[0].toUpperCase() + trimmed.slice(1).toLowerCase();
    }

    function normalizeName(value) {
      let normalized = value.trim().replace(/\s+/g, "");
      return aliases[normalized] || normalized;
    }

    function makeQuestions(selectedMode) {
      if (selectedMode === "nameToSymbol") {
        return shuffle(elements.map(el => ({
          type: "nameToSymbol",
          prompt: el.name,
          answer: el.symbol,
          element: el
        })));
      }

      if (selectedMode === "symbolToName") {
        return shuffle(elements.map(el => ({
          type: "symbolToName",
          prompt: el.symbol,
          answer: el.name,
          element: el
        })));
      }

      const both = [];
      elements.forEach(el => {
        both.push({
          type: "nameToSymbol",
          prompt: el.name,
          answer: el.symbol,
          element: el
        });
        both.push({
          type: "symbolToName",
          prompt: el.symbol,
          answer: el.name,
          element: el
        });
      });
      return shuffle(both);
    }

    function startQuiz(newMode = mode) {
      mode = newMode;
      questions = makeQuestions(mode);
      currentIndex = 0;
      correct = 0;
      wrong = 0;
      answered = false;
      resultEl.textContent = "";
      resultEl.className = "result";
      updateModeButtons();
      showQuestion();
    }

    function updateModeButtons() {
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });
    }

    function showQuestion() {
      if (currentIndex >= questions.length) {
        const total = correct + wrong;
        const rate = total === 0 ? 0 : Math.round((correct / total) * 100);

        questionTypeEl.textContent = "終了";
        questionEl.textContent = "Finish!";
        progressTextEl.textContent = `${questions.length} / ${questions.length}`;
        scoreTextEl.textContent = `正解: ${correct}　不正解: ${wrong}`;
        progressBarEl.style.width = "100%";
        resultEl.className = "result correct";
        resultEl.innerHTML = `終了！ 正答率は ${rate}% です。<br>もう一度やるなら「最初から」を押してください。`;
        inputEl.value = "";
        inputEl.disabled = true;
        checkBtn.disabled = true;
        skipBtn.disabled = true;
        return;
      }

      const q = questions[currentIndex];
      const label = q.type === "nameToSymbol" ? "元素名 → 元素記号" : "元素記号 → 元素名";

      questionTypeEl.textContent = label;
      questionEl.textContent = q.prompt;
      progressTextEl.textContent = `${currentIndex + 1} / ${questions.length}`;
      scoreTextEl.textContent = `正解: ${correct}　不正解: ${wrong}`;
      progressBarEl.style.width = `${(currentIndex / questions.length) * 100}%`;

      inputEl.value = "";
      inputEl.placeholder = q.type === "nameToSymbol" ? "例：H" : "例：水素";
      inputEl.disabled = false;
      checkBtn.disabled = false;
      skipBtn.disabled = false;
      answered = false;
      inputEl.focus();
    }

    function checkAnswer() {
      if (answered || currentIndex >= questions.length) return;

      const q = questions[currentIndex];
      const userAnswer = q.type === "nameToSymbol"
        ? normalizeSymbol(inputEl.value)
        : normalizeName(inputEl.value);

      const correctAnswer = q.type === "nameToSymbol"
        ? q.answer
        : q.answer;

      if (!userAnswer) {
        resultEl.className = "result wrong";
        resultEl.textContent = "答えを入力してね。";
        return;
      }

      answered = true;

      if (userAnswer === correctAnswer) {
        correct++;
        resultEl.className = "result correct";
        resultEl.textContent = `正解！ ${q.element.no}. ${q.element.name} - ${q.element.symbol}`;
      } else {
        wrong++;
        resultEl.className = "result wrong";
        resultEl.textContent = `不正解。正解は「${correctAnswer}」です。${q.element.no}. ${q.element.name} - ${q.element.symbol}`;
      }

      scoreTextEl.textContent = `正解: ${correct}　不正解: ${wrong}`;

      setTimeout(() => {
        currentIndex++;
        showQuestion();
        resultEl.textContent = "";
        resultEl.className = "result";
      }, 900);
    }

    function skipQuestion() {
      if (currentIndex >= questions.length) return;

      const q = questions[currentIndex];
      wrong++;
      resultEl.className = "result wrong";
      resultEl.textContent = `スキップ。正解は「${q.answer}」です。${q.element.no}. ${q.element.name} - ${q.element.symbol}`;

      setTimeout(() => {
        currentIndex++;
        showQuestion();
        resultEl.textContent = "";
        resultEl.className = "result";
      }, 900);
    }

    function buildElementList() {
      elementListEl.innerHTML = elements.map(el => `
        <div class="element-item">
          <span class="symbol">${el.no}. ${el.symbol}</span>${el.name}
        </div>
      `).join("");
    }

    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        startQuiz(btn.dataset.mode);
      });
    });

    checkBtn.addEventListener("click", checkAnswer);
    skipBtn.addEventListener("click", skipQuestion);
    restartBtn.addEventListener("click", () => startQuiz(mode));

    inputEl.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        checkAnswer();
      }
    });

    toggleListBtn.addEventListener("click", () => {
      elementListEl.classList.toggle("show");
      toggleListBtn.textContent = elementListEl.classList.contains("show")
        ? "元素一覧を隠す"
        : "元素一覧を表示";
    });

    buildElementList();
    startQuiz("nameToSymbol");
  </script>
</body>
</html>
